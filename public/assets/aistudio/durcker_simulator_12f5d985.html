<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Drucker-Prüfungssimulator & Nachschlagewerk</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct-bg: #15803d;
            --correct-border: #22c55e;
            --wrong-bg: #b91c1c;
            --wrong-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* --- QUIZ STYLES --- */
        .quiz-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .question-number {
            color: var(--accent-green);
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-item:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .option-item.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.2);
        }

        .option-item.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: white;
        }

        .option-item.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: white;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .option-item.selected .checkbox-custom {
            border-color: var(--accent-blue);
            background-color: var(--accent-blue);
            color: white;
        }

        .explanation-box {
            background-color: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-blue);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* --- NACHSCHLAGEWERK STYLES --- */
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .reference-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .reference-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-green);
        }

        .option-analysis {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .analysis-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .analysis-item.correct {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--correct-border);
        }

        .analysis-item.wrong {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .score-overview {
            text-align: center;
            padding: 40px 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CompTIA A+ Core 1 – Drucker-Simulator</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchView('quiz')">Prüfungssimulator</button>
            <button class="tab-btn" onclick="switchView('reference')">Nachschlagewerk & Erklärungen</button>
        </div>
    </header>

    <main>
        <!-- PRÜFUNGSSIMULATOR VIEW -->
        <div id="quiz-view" class="view active">
            <div class="quiz-card" id="quiz-card">
                <div class="quiz-header">
                    <span class="question-number" id="q-number">Frage 1 von 36</span>
                    <span id="q-score">Score: 0%</span>
                </div>
                
                <div class="question-text" id="q-text">Lade Frage...</div>
                
                <div class="options-list" id="q-options"></div>

                <div class="explanation-box" id="q-explanation"></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>

                <div class="controls">
                    <button class="btn btn-secondary" onclick="prevQuestion()" id="btn-prev">Zurück</button>
                    <button class="btn" onclick="checkOrNext()" id="btn-action">Antwort prüfen</button>
                </div>
            </div>
        </div>

        <!-- NACHSCHLAGEWERK VIEW -->
        <div id="reference-view" class="view">
            <input type="text" class="search-bar" id="search-input" placeholder="Fragen oder Themen durchsuchen (z.B. Fuser, SMB, Tonerkassette)..." oninput="filterReference()">
            <div id="reference-list"></div>
        </div>
    </main>

    <script>
        /* ALLE 36 FRAGEN MIT VOLLSTÄNDIGEN ANALYSEN */
        const questionsData = [
            {
                id: 3,
                question: "Ein Techniker sucht bei einem All-in-One-Laserdrucker die Ursache dafür, dass beim Kopieren und Scannen eine vertikale Linie gedruckt wird. Beim Drucken oder Empfangen von Faxen ist die Ausgabe des Druckers korrekt. Was sollte der Techniker untersuchen, um die Ursache des Problems zu ermitteln?",
                multi: false,
                options: [
                    { id: "A", text: "Die Einzugsrollen", correct: false, exp: "Falsch. Beschädigte Einzugsrollen verursachen Papierstaus oder Einzugsfehler, jedoch keine vertikalen Streifen beim Scannen." },
                    { id: "B", text: "Den Corona-Draht", correct: false, exp: "Falsch. Ein verschmutzter Corona-Draht führt zu wiederkehrenden Mustern oder Streifen auf allen Druckausgaben (auch bei Faxen und normalen Ausdrucken)." },
                    { id: "C", text: "Den Dokumenteneinzug (ADF) / Flachbettglas", correct: true, exp: "Richtig. Schmutz oder ein Kratzer auf dem Glas des Dokumenteneinzugs hinterlässt beim Durchlauf der Vorlage eine durchgehende Linie auf dem Scan. Drucke und Empfangsfaxe nutzen das Scanglas nicht und bleiben daher sauber." },
                    { id: "D", text: "Die Trommeleinheit", correct: false, exp: "Falsch. Ein Trommelschaden würde sich auf alle Druckaufträge auswirken, nicht nur auf Kopien/Scans." }
                ]
            },
            {
                id: 18,
                question: "Ein Benutzer möchte Dateien von einem Auslandsbüro aus über einen freigegebenen Netzwerkordner drucken. Der Laptop des Benutzers hat keine öffentlich zugängliche Internetverbindung. Was kann verwendet werden, um vom freigegebenen Netzwerkordner aus zu drucken?",
                multi: false,
                options: [
                    { id: "A", text: "ADF", correct: false, exp: "Falsch. ADF (Automatic Document Feeder) ist eine Hardwarekomponente zum automatischen Einziehen von Papier." },
                    { id: "B", text: "USB", correct: false, exp: "Falsch. USB erfordert eine direkte Kabelverbindung zum Drucker oder Host." },
                    { id: "C", text: "PCL", correct: false, exp: "Falsch. PCL ist eine Druckersprache zur Aufbereitung von Steuerbefehlen, kein Netzwerkprotokoll zur Ordnerfreigabe." },
                    { id: "D", text: "SMB", correct: true, exp: "Richtig. Server Message Block (SMB) ist das Standardnetzwerkprotokoll für Datei- und Druckerfreigaben in lokalen Netzwerken (LAN/VPN)." }
                ]
            },
            {
                id: 24,
                question: "Der Drucker in einem Hauptbüro staut sich wiederholt. Welche Aufgabe sollte ein Support-Techniker ausführen, um das Problem zu lösen?",
                multi: false,
                options: [
                    { id: "A", text: "Ein Wartungskit anwenden.", correct: true, exp: "Richtig. Ein Wartungskit (Maintenance Kit) enthält frische Einzugsrollen, Trennpads und Fixierkomponenten, deren Abnutzung die Ursache für wiederholte Staus ist." },
                    { id: "B", text: "Toner- oder Tintenpatronen austauschen.", correct: false, exp: "Falsch. Verbrauchsmaterialien beeinflussen die Farbmenge, lösen jedoch keine mechanischen Einzugsprobleme." },
                    { id: "C", text: "Ein neues Farbband installieren.", correct: false, exp: "Falsch. Farbbänder werden in Nadeldruckern genutzt und steuern das Schriftbild, nicht den Papiertransport." },
                    { id: "D", text: "Den Druckkopf wechseln.", correct: false, exp: "Falsch. Ein defekter Druckkopf verschlechtert das Druckbild, erzeugt aber keine Papierstaus." }
                ]
            },
            {
                id: 25,
                question: "Ein Techniker installiert einen neuen Drucker. Nach der Registrierung des Druckers erhält der Techniker eine E-Mail des Herstellers, in der auf eine behebbare Sicherheitslücke hingewiesen wird. Welchen Schritt sollte der Techniker als Nächstes durchführen?",
                multi: false,
                options: [
                    { id: "A", text: "Die drahtlose Konnektivität deaktivieren.", correct: false, exp: "Falsch. Schränkt die Funktion ein, behebt aber nicht die eigentliche Schwachstelle im Systemcode." },
                    { id: "B", text: "Audit-Protokollierung aktivieren.", correct: false, exp: "Falsch. Dient nur der Aufzeichnung von Ereignissen, schließt die Sicherheitslücke jedoch nicht." },
                    { id: "C", text: "Die Firmware aktualisieren.", correct: true, exp: "Richtig. Hersteller stellen Firmware-Updates bereit, um bekannte Sicherheitslücken direkt im Betriebssystem des Geräts zu schließen." },
                    { id: "D", text: "Das Standard-Gateway auf dem Drucker deaktivieren.", correct: false, exp: "Falsch. Verhindert Routing außerhalb des Subnetzes, löst jedoch das zugrunde liegende Softwareproblem nicht." }
                ]
            },
            {
                id: 31,
                question: "Ein Benutzer druckt einen Auftrag von einem Laserdrucker. Er wischt über die Seite, und Wörter und Bilder lösen sich ab. Der Techniker tauscht die Tonerkassette aus, aber das Problem besteht weiterhin. Welche Komponente sollte der Techniker als Nächstes austauschen?",
                multi: false,
                options: [
                    { id: "A", text: "Fixiereinheit (Fuser)", correct: true, exp: "Richtig. Die Fixiereinheit schmilzt das Tonerpulver mittels Hitze und Druck in die Papierfasern ein. Funktioniert sie nicht, bleibt der Toner lose auf dem Papier liegen." },
                    { id: "B", text: "Trommel", correct: false, exp: "Falsch. Die Trommel überträgt das Tonerbild elektrostatisch, brennt es aber nicht ein." },
                    { id: "C", text: "Entwicklerwalze", correct: false, exp: "Falsch. Sie transportiert den Toner aus der Kassette zur Trommel." },
                    { id: "D", text: "Entladungslampe", correct: false, exp: "Falsch. Sie löscht die Restladung auf der Trommel nach dem Druckvorgang." }
                ]
            },
            {
                id: 46,
                question: "Ein Kunde muss einen neuen Drucker in seinem Netzwerk installieren. Der Kunde berichtet, dass Benutzer bei früheren Druckern zeitweise Verbindungsprobleme hatten. Was sollte der Techniker auf dem neuen Drucker konfigurieren, um dies zu verhindern?",
                multi: false,
                options: [
                    { id: "A", text: "Gateway-IP-Adresse", correct: false, exp: "Falsch. Gibt lediglich den Router für verbindungsexterne Netzwerke an." },
                    { id: "B", text: "DHCP-IP-Adresse", correct: false, exp: "Falsch. Dynamische Adressen ändern sich regelmäßig, was zu Verbindungsabbrüchen bei eingerichteten Clients führt." },
                    { id: "C", text: "Statische IP-Adresse", correct: true, exp: "Richtig. Eine feste IP stellt sicher, dass der Drucker dauerhaft unter derselben Adresse im Netzwerk erreichbar bleibt." },
                    { id: "D", text: "Öffentliche IP-Adresse", correct: false, exp: "Falsch. Drucker sollten im lokalen Netzwerk (private IP) betrieben werden, um nicht direkt Angriffen aus dem Internet ausgesetzt zu sein." }
                ]
            },
            {
                id: 63,
                question: "Ein Benutzer druckt eine Tabelle im Duplexmodus. Die Tabelle ist schwer lesbar, da einige Spalten auf die zweite Seite des Blattes überlaufen. Was sollte der Benutzer tun, um das Problem zu vermeiden, aber trotzdem beidseitig zu drucken?",
                multi: false,
                options: [
                    { id: "A", text: "Den Duplexdruck deaktivieren.", correct: false, exp: "Falsch. Löst das Breitenproblem nicht und verhindert beidseitiges Drucken." },
                    { id: "B", text: "Eine kleinere Schriftgröße in der Tabelle verwenden.", correct: false, exp: "Unzweckmäßig. Verändert das Format des Dokuments unnotwendig und erschwert die Lesbarkeit." },
                    { id: "C", text: "Die Seitenausrichtung ändern.", correct: true, exp: "Richtig. Das Drehen von Hochformat (Portrait) auf Querformat (Landscape) bietet mehr horizontale Breite für breite Tabellen." },
                    { id: "D", text: "Einen anderen Druckertreiber verwenden.", correct: false, exp: "Falsch. Treiber beeinflussen die Interpretation des Druckbefehls, ändern aber nicht das Papierlayout der Anwendung." }
                ]
            },
            {
                id: 74,
                question: "Ein Benutzer meldet, dass Ausdrucke von einem Laserdrucker Streifen und Schmierstellen aufweisen. Der Drucker zieht zudem gelegentlich das Papier falsch ein. Welche Komponente sollte ein Techniker austauschen, um dies zu beheben?",
                multi: false,
                options: [
                    { id: "A", text: "Fixiereinheit (Fuser)", correct: false, exp: "Unvollständig. Löst eventuell Schmierstellen, behebt jedoch keine Papiereinzugsprobleme." },
                    { id: "B", text: "Wartungskit", correct: true, exp: "Richtig. Enthält Rollen gegen die Fehleinzüge sowie Reinigungselemente/Fixierkomponenten gegen die Streifen und Schmierstellen." },
                    { id: "C", text: "Corona-Draht", correct: false, exp: "Falsch. Betrifft nur die elektrostatische Aufladung, nicht den Papiereinzug." },
                    { id: "D", text: "Tonerkassette", correct: false, exp: "Falsch. Behebt keine mechanischen Einzugsfehler." }
                ]
            },
            {
                id: 79,
                question: "Ein Helpdesk-Techniker muss an einem Drucker mit hohem Durchsatz arbeiten. Benutzer haben gelegentliche Papierstaus und Schmierstellen auf gedruckten Dokumenten gemeldet. Was sollte der Techniker als Nächstes tun, um diese Probleme zu beheben?",
                multi: false,
                options: [
                    { id: "A", text: "Einen vollständigen Werksreset durchführen.", correct: false, exp: "Falsch. Setzt Softwareeinstellungen zurück, behebt jedoch keine physischen Verschmutzungen." },
                    { id: "B", text: "Die Rollen prüfen und reinigen.", correct: true, exp: "Richtig. Schmutz auf Einzugs- und Transportrollen führt zu Rutschen (Papierstau) und Tonerübertragung (Schmierstellen). Erste, kostengünstige Maßnahme." },
                    { id: "C", text: "Alle Tinten- oder Tonerkassetten austauschen.", correct: false, exp: "Unnotwendig. Patronen verursachen bei Verschmutzung keine Papierstaus." },
                    { id: "D", text: "Die Fixiereinheit austauschen.", correct: false, exp: "Voreilig. Sollte erst nach Reinigung der mechanischen Transportwege in Betracht gezogen werden." }
                ]
            },
            {
                id: 85,
                question: "Bilder und Text von einem Laserdrucker verschmieren bei Berührung. Was sollte ein Techniker zur Behebung tun?",
                multi: false,
                options: [
                    { id: "A", text: "Die Tonerfüllstände prüfen.", correct: false, exp: "Falsch. Der Füllstand hat keinen Einfluss auf die Haftung des Toners auf dem Papier." },
                    { id: "B", text: "Ein Wartungskit installieren.", correct: false, exp: "Zu umfangreich. Enthält zwar oft eine Fixiereinheit, der gezielte Austausch der Ursache ist jedoch primär gefordert." },
                    { id: "C", text: "Die Fixiereinheit austauschen.", correct: true, exp: "Richtig. Mangelnde Hitze/Druck der Fixiereinheit verhindert das dauerhafte Schmelzen des Toners." },
                    { id: "D", text: "Die Einzugsrollen reinigen.", correct: false, exp: "Falsch. Beseitigt Einzugsprobleme, aber kein Schmelzdefekt." }
                ]
            },
            {
                id: 92,
                question: "Ein Techniker muss herausfinden, warum ein Laserdrucker beim Drucken zeitweise kein Papier einzieht. Der Techniker überprüft das Problem durch mehrere Kopier- und Drucktests. Was sollte der Techniker als Nächstes tun?",
                multi: false,
                options: [
                    { id: "A", text: "Die Druckertreiber aktualisieren.", correct: false, exp: "Falsch. Ein physisches Einzugsproblem ist mechanischer Natur." },
                    { id: "B", text: "Die richtige Papiergröße auswählen.", correct: false, exp: "Falsch. Falsche Größen führen zu Fehlermeldungen im Display, nicht zu rutschenden Einzugsrollen." },
                    { id: "C", text: "Die Einzugsrollen reinigen.", correct: true, exp: "Richtig. Papierstaub verringert den Grip der Gummirollen; das Reinigen stellt die Reibung wieder her." },
                    { id: "D", text: "Die Tonerkassette austauschen.", correct: false, exp: "Falsch. Hat keine Funktion beim Papiereinzug." }
                ]
            },
            {
                id: 99,
                question: "Ein Techniker richtet eine Scan-to-SMB-Funktion auf einem Multifunktionsdrucker ein. Welchen Verbindungstyp sollte der Techniker konfigurieren?",
                multi: false,
                options: [
                    { id: "A", text: "E-Mail-Server", correct: false, exp: "Falsch. Wäre für Scan-to-Email (SMTP) erforderlich." },
                    { id: "B", text: "SFTP-Verbindung", correct: false, exp: "Falsch. Nutzt SSH zur gesicherten Dateiübertragung, nicht das SMB-Protokoll." },
                    { id: "C", text: "Netzwerkfreigabe", correct: true, exp: "Richtig. SMB dient dem Dateizugriff auf freigegebene Ordner (Netzwerkfreigaben) im LAN." },
                    { id: "D", text: "Druckdienste", correct: false, exp: "Falsch. Verwalten eingehende Druckaufträge, keine abgehenden Scans." }
                ]
            },
            {
                id: 100,
                question: "Ein Benutzer meldet schlechte Druckqualität bei seinem Tischdrucker. Ein Techniker tauscht die Tintenpatrone aus, aber das Problem bleibt bestehen. Was sollte der Techniker als Nächstes tun?",
                multi: false,
                options: [
                    { id: "A", text: "Die Einzugsrollen austauschen", correct: false, exp: "Falsch. Beeinflusst nur den Transport, nicht das Schriftbild." },
                    { id: "B", text: "Die Druckköpfe reinigen", correct: true, exp: "Richtig. Verstopfte Düsen verhindern den korrekten Tintenaustritt und erzeugen Streifen oder blasse Farben." },
                    { id: "C", text: "Den Papiertyp wechseln", correct: false, exp: "Falsch. Verbessert eventuell das Aufsaugverhalten, löst aber keine verstopften Düsen." },
                    { id: "D", text: "Das Farbband wechseln", correct: false, exp: "Falsch. Farbbänder existieren nur bei Nadeldruckern." }
                ]
            },
            {
                id: 113,
                question: "Ein Benutzer erhält ständig eine Fehlermeldung beim Versuch, einen Brief zu drucken. Der Drucker wird normalerweise zum Drucken von Karten und Einladungen verwendet. Der Benutzer versucht, von einem anderen Computer aus zu drucken, aber das Problem bleibt bestehen. Was sollte der Benutzer zur Behebung tun?",
                multi: false,
                options: [
                    { id: "A", text: "Weniger Seiten drucken.", correct: false, exp: "Falsch. Die Seitenzahl hat keinen Einfluss auf Format-Mismatches." },
                    { id: "B", text: "Auf Karton drucken.", correct: false, exp: "Falsch. Gefragter Inhalt ist ein Brief auf Normalpapier." },
                    { id: "C", text: "Die Rollen austauschen.", correct: false, exp: "Falsch. Es liegt kein mechanischer Defekt vor." },

                options: [

                    { id: "B", text: "Sicherstellen, dass PostScript-Treiber verwendet werden.", correct: false, exp: "Falsch. Löst keine Randausrichtungsprobleme." },
                    { id: "C", text: "Die Ausrichtungseinstellungen des Druckers prüfen.", correct: true, exp: "Richtig. Wenn die Ränder oder der Einzugswinkel (Alignment/Offset) falsch eingestellt sind, stimmen die gedruckten Inhalte nicht mit den gedruckten Feldern überein." },
                    { id: "D", text: "Sicherstellen, dass die Einzugsrollen das Papier fest greifen.", correct: false, exp: "Zweitrangig. Verursacht eher Papierstaus als gleichmäßige Verschiebungen." }
                ]
            },
            {
                id: 290,
                question: "Ein Benutzer möchte einen Drucker für die Scan-to-Email-Funktion einrichten. Was sollte am Drucker konfiguriert werden, um diese Anforderung zu erfüllen?",
                multi: false,
                options: [
                    { id: "A", text: "SMS", correct: false, exp: "Falsch. Kurznachrichtendienst für Mobilfunk." },
                    { id: "B", text: "SMTP", correct: true, exp: "Richtig. Simple Mail Transfer Protocol ist das Standardprotokoll zum Versenden von E-Mails." },
                    { id: "C", text: "SFTP", correct: false, exp: "Falsch. Protokoll zur sicheren Dateiübertragung." },
                    { id: "D", text: "SMB", correct: false, exp: "Falsch. Protokoll zur Dateifreigabe in Netzwerken (Scan-to-Folder)." }
                ]
            },
            {
                id: 293,
                question: "Ein Administrator konfiguriert ein SOHO-Netzwerk. Der Netzwerkbereich erfordert statische IP-Adressen für Drucker. Was muss der Administrator manuell festlegen? (Zwei auswählen.)",
                multi: true,
                options: [
                    { id: "A", text: "DHCP", correct: false, exp: "Falsch. Wird bei manueller (statischer) Zuweisung umgangen." },
                    { id: "B", text: "Subnetzmaske", correct: true, exp: "Richtig (1 von 2). Bestimmt, welcher Teil der IP-Adresse das Netzwerk und welcher den Host identifiziert." },
                    { id: "C", text: "Standard-Gateway", correct: true, exp: "Richtig (2 von 2). Erforderlich, damit der Drucker auch außerhalb seines eigenen lokalen Subnetzes erreichbar ist." },
                    { id: "D", text: "DNS", correct: false, exp: "Optional. Nicht zwingend für die reine IP-Erreichbarkeit im lokalen Netz erforderlich." },
                    { id: "E", text: "Reservierungen", correct: false, exp: "Falsch. Werden auf dem DHCP-Server konfiguriert, nicht manuell am Drucker eingestellt." },
                    { id: "F", text: "Ausschlüsse", correct: false, exp: "Falsch. Werden ebenfalls auf dem DHCP-Server verwaltet." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = {};
        let score = 0;
        let isChecked = false;

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if (viewName === 'quiz') {
                document.getElementById('quiz-view').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('reference-view').classList.add('active');
                event.target.classList.add('active');
                renderReference();
            }
        }

        function loadQuestion() {
            isChecked = false;
            const q = questionsData[currentQuestionIndex];
            
            document.getElementById('q-number').innerText = `Frage ${currentQuestionIndex + 1} von ${questionsData.length}`;
            document.getElementById('q-text').innerText = `${q.id > 0 ? 'Frage ' + q.id + ': ' : ''}${q.question}`;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';
            
            const selected = userAnswers[currentQuestionIndex] || [];

            q.options.forEach(opt => {
                const item = document.createElement('div');
                item.className = `option-item ${selected.includes(opt.id) ? 'selected' : ''}`;
                item.onclick = () => selectOption(opt.id, q.multi);
                
                item.innerHTML = `
                    <div class="checkbox-custom">${opt.id}</div>
                    <div>${opt.text}</div>
                `;
                optionsContainer.appendChild(item);
            });

            document.getElementById('q-explanation').style.display = 'none';
            document.getElementById('q-explanation').innerHTML = '';
            
            document.getElementById('btn-action').innerText = "Antwort prüfen";
            document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;

            const progress = ((currentQuestionIndex + 1) / questionsData.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            
            updateScoreDisplay();
        }

        function selectOption(optionId, isMulti) {
            if (isChecked) return;

            if (!userAnswers[currentQuestionIndex]) {
                userAnswers[currentQuestionIndex] = [];
            }

            let selected = userAnswers[currentQuestionIndex];

            if (isMulti) {
                if (selected.includes(optionId)) {
                    selected = selected.filter(id => id !== optionId);
                } else {
                    selected.push(optionId);
                }
            } else {
                selected = [optionId];
            }

            userAnswers[currentQuestionIndex] = selected;
            loadQuestion();
        }

        function checkOrNext() {
            if (!isChecked) {
                const q = questionsData[currentQuestionIndex];
                const selected = userAnswers[currentQuestionIndex] || [];

                if (selected.length === 0) {
                    alert("Bitte wähle mindestens eine Antwort aus!");
                    return;
                }

                isChecked = true;
                const correctIds = q.options.filter(o => o.correct).map(o => o.id);
                
                const isCorrect = selected.length === correctIds.length && selected.every(id => correctIds.includes(id));

                const optionElements = document.querySelectorAll('.option-item');
                q.options.forEach((opt, idx) => {
                    const el = optionElements[idx];
                    if (opt.correct) {
                        el.classList.add('correct');
                    } else if (selected.includes(opt.id)) {
                        el.classList.add('wrong');
                    }
                });

                let explanationHTML = `<strong>${isCorrect ? 'Richtig!' : 'Falsch!'}</strong><br><br>`;
                q.options.forEach(opt => {
                    explanationHTML += `<strong>Option ${opt.id}:</strong> ${opt.exp}<br>`;
                });

                const expBox = document.getElementById('q-explanation');
                expBox.innerHTML = explanationHTML;
                expBox.style.display = 'block';

                document.getElementById('btn-action').innerText = currentQuestionIndex === questionsData.length - 1 ? "Ergebnis anzeigen" : "Nächste Frage";
                updateScoreDisplay();
            } else {
                if (currentQuestionIndex < questionsData.length - 1) {
                    currentQuestionIndex++;
                    loadQuestion();
                } else {
                    showFinalScore();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function updateScoreDisplay() {
            let correctCount = 0;
            let answeredCount = 0;

            questionsData.forEach((q, idx) => {
                const selected = userAnswers[idx];
                if (selected && selected.length > 0) {
                    answeredCount++;
                    const correctIds = q.options.filter(o => o.correct).map(o => o.id);
                    if (selected.length === correctIds.length && selected.every(id => correctIds.includes(id))) {
                        correctCount++;
                    }
                }
            });

            const percent = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            document.getElementById('q-score').innerText = `Score: ${percent}%`;
        }

        function showFinalScore() {
            let correctCount = 0;
            questionsData.forEach((q, idx) => {
                const selected = userAnswers[idx] || [];
                const correctIds = q.options.filter(o => o.correct).map(o => o.id);
                if (selected.length === correctIds.length && selected.every(id => correctIds.includes(id))) {
                    correctCount++;
                }
            });

            const percent = Math.round((correctCount / questionsData.length) * 100);

            const card = document.getElementById('quiz-card');
            card.innerHTML = `
                <div class="score-overview">
                    <h2>Prüfung beendet!</h2>
                    <br>
                    <div class="score-circle">${percent}%</div>
                    <p>Du hast <strong>${correctCount} von ${questionsData.length}</strong> Fragen richtig beantwortet.</p>
                    <br><br>
                    <button class="btn" onclick="location.reload()">Simulator neu starten</button>
                </div>
            `;
        }

        /* NACHSCHLAGEWERK FUNKTIONEN */
        function renderReference() {
            const container = document.getElementById('reference-list');
            container.innerHTML = '';

            questionsData.forEach(q => {
                const card = document.createElement('div');
                card.className = 'reference-card';
                
                let optionsHTML = '';
                q.options.forEach(opt => {
                    optionsHTML += `
                        <div class="analysis-item ${opt.correct ? 'correct' : 'wrong'}">
                            <strong>Option ${opt.id}: ${opt.text}</strong> ${opt.correct ? '(RICHTIG)' : '(FALSCH)'}<br>
                            ${opt.exp}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="reference-title">Frage ${q.id > 0 ? q.id : ''}: ${q.question}</div>
                    <div class="option-analysis">${optionsHTML}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterReference() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.reference-card');

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Simulator beim Laden starten
        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>
